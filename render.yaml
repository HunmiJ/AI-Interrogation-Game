services:
  - type: web
    name: ai-interrogation-game
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: LLM_PROVIDER
        value: deepseek
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: deepseek-v4-flash
      - key: LLM_BASE_URL
        value: https://api.deepseek.com
      - key: LLM_TIMEOUT_MS
        value: "60000"
      - key: DEBUG_AI_INVESTIGATION
        value: "false"
      - key: DEBUG_DYNAMIC_CASE_INVESTIGATION
        value: "false"
